worker_processes auto;
events { worker_connections 4096; }
http {
    server {
        listen 80;
        location /buy {
            default_type application/json;
            content_by_lua_block {
                local cjson = require "cjson"
                local redis = require "resty.redis"
                local args = ngx.req.get_uri_args()
                
                local ticket_id = args.ticket_id
                local seat_id = args.seat_id
                
                if not ticket_id or not seat_id then
                    ngx.status = 400; ngx.say(cjson.encode({error = "Missing ticket_id or seat_id"})); return
                end
                
                local seat_num = tonumber(seat_id)
                if not seat_num then
                    ngx.status = 400; ngx.say(cjson.encode({error = "seat_id must be a number"})); return
                end
                
                -- Deterministic Routing based on Seat Number
                local primary_idx = (seat_num % 2) + 1
                local shard_names = {"shard-a", "shard-b"}
                local active_shard = shard_names[primary_idx]
                
                local sentinels = {
                    {host = "10.0.1.248", port = 26379},
                    {host = "10.0.1.136", port = 26379},
                    {host = "10.0.1.201", port = 26379}
                }
                
                local function get_master_ip(shard_name)
                    for _, sent in ipairs(sentinels) do
                        local red_sent = redis:new()
                        red_sent:set_timeouts(500, 500, 500)
                        local ok = red_sent:connect(sent.host, sent.port)
                        if ok then
                            local res = red_sent:sentinel("get-master-addr-by-name", shard_name)
                            red_sent:set_keepalive(10000, 10)
                            if res and type(res) == "table" then return res[1], res[2] end
                        end
                    end
                    return nil, "Sentinels unreachable"
                end
                
                local master_ip, master_port = get_master_ip(active_shard)
                if not master_ip then 
                    ngx.status = 503; ngx.say(cjson.encode({error = "Service Discovery Failed for " .. active_shard})); return 
                end
                
                local red = redis:new()
                red:set_timeouts(1000, 1000, 2000) 
                local ok = red:connect(master_ip, master_port)
                if not ok then 
                    ngx.status = 500; ngx.say(cjson.encode({error = "Connection failed to master"})); return 
                end
                
                -- Notice we pass "seat-" .. seat_id to keys[2]
                local res, err = red:fcall("buy_ticket", 2, "purchased_tracking_ids", "seat-" .. seat_id, ticket_id)
                if not res then 
                    ngx.status = 500; ngx.say(cjson.encode({error = "Database execution error"})); return 
                end
                
                if tonumber(res) == 1 then
                    local wait_res = red:wait(1, 1000)
                    if not wait_res or tonumber(wait_res) == 0 then
                        local rb_res, rb_err = red:fcall("rollback_ticket", 2, "purchased_tracking_ids", "seat-" .. seat_id, ticket_id)
                        if not rb_res then
                            ngx.log(ngx.ERR, "CRITICAL: Rollback failed for ID ", ticket_id)
                            ngx.status = 500; ngx.say(cjson.encode({error = "FATAL: Replication failed and rollback aborted"})); return
                        end
                        ngx.status = 500; ngx.say(cjson.encode({error = "Replication timeout. Purchase rolled back."})); return
                    end
                end
                red:set_keepalive(10000, 100)
                
                -- Response Translation
                if tonumber(res) == -1 then
                    ngx.status = 409; ngx.say(cjson.encode({error = "Ticket already purchased", processed_by = active_shard}))
                elseif tonumber(res) == -2 then
                    ngx.status = 410; ngx.say(cjson.encode({error = "Seat unavailable or sold out"}))
                else
                    ngx.status = 200; ngx.say(cjson.encode({status = "success", seat = seat_id, shard = active_shard, ip = master_ip}))
                end
            }
        }
    }
}
