worker_processes auto;
events { worker_connections 4096; }
http {
    server {
        listen 80;
        location /buy {
            default_type application/json;
            content_by_lua_block {
                local cjson = require "cjson"
                local redis = require "resty.redis"
                local args = ngx.req.get_uri_args()
                local ticket_id = args.ticket_id
                
                if not ticket_id then
                    ngx.status = 400; ngx.say(cjson.encode({error = "Missing ticket_id"})); return
                end
                
                -- Partitioning Index Logic
                local hash = ngx.crc32_short(ticket_id)
                local primary_idx = (hash % 2) + 1
                local secondary_idx = (primary_idx % 2) + 1
                local shard_names = {"shard-a", "shard-b"}
                local primary_shard = shard_names[primary_idx]
                local secondary_shard = shard_names[secondary_idx]
                
                -- Sentinel Quorum (AWS Private IPs)
                local sentinels = {
                    {host = "10.0.1.248", port = 26379},
                    {host = "10.0.1.136", port = 26379},
                    {host = "10.0.1.201", port = 26379}
                }
                
                local function get_master_ip(shard_name)
                    for _, sent in ipairs(sentinels) do
                        local red_sent = redis:new()
                        red_sent:set_timeouts(500, 500, 500)
                        local ok = red_sent:connect(sent.host, sent.port)
                        if ok then
                            local res = red_sent:sentinel("get-master-addr-by-name", shard_name)
                            red_sent:set_keepalive(10000, 10)
                            if res and type(res) == "table" then return res[1], res[2] end
                        end
                    end
                    return nil, "Sentinels unreachable"
                end
                
                -- Encapsulated Saga Transaction Routine
                local function process_shard(shard_name)
                    local master_ip, master_port = get_master_ip(shard_name)
                    if not master_ip then return false, 503, "Service Discovery Failed for " .. shard_name end
                    
                    local red = redis:new()
                    red:set_timeouts(1000, 1000, 2000) 
                    local ok = red:connect(master_ip, master_port)
                    if not ok then return false, 500, "Connection failed to active master: " .. tostring(master_ip) end
                    
                    local res, err = red:fcall("buy_ticket", 2, "purchased_tracking_ids", "tickets-counter", ticket_id)
                    if not res then return false, 500, "Database execution error" end
                    
                    -- Evaluate Strict Consistency
                    if tonumber(res) >= 0 then
                        local wait_res = red:wait(1, 1000)
                        if not wait_res or tonumber(wait_res) == 0 then
                            local rb_res, rb_err = red:fcall("rollback_ticket", 2, "purchased_tracking_ids", "tickets-counter", ticket_id)
                            if not rb_res then
                                ngx.log(ngx.ERR, "CRITICAL: Rollback failed for ID ", ticket_id, " - Error: ", rb_err)
                                return false, 500, "FATAL: Replication failed and rollback aborted."
                            end
                            return false, 500, "Replication timeout. Purchase rolled back."
                        end
                    end
                    red:set_keepalive(10000, 100)
                    return true, res, master_ip
                end
                
                -- ATTEMPT 1: Primary Partition
                local active_shard = primary_shard
                local ok, res, msg_or_ip = process_shard(primary_shard)
                
                if not ok then
                    ngx.status = res; ngx.say(cjson.encode({error = msg_or_ip})); return
                end
                
                -- ATTEMPT 2: Fallback Partition (If Primary returns -2)
                if tonumber(res) == -2 then
                    active_shard = secondary_shard
                    ok, res, msg_or_ip = process_shard(secondary_shard)
                    
                    if not ok then
                        ngx.status = res; ngx.say(cjson.encode({error = msg_or_ip})); return
                    end
                end
                
                -- Response Translation Layer
                if tonumber(res) == -1 then
                    ngx.status = 409; ngx.say(cjson.encode({error = "Ticket already purchased", processed_by = active_shard}))
                elseif tonumber(res) == -2 then
                    ngx.status = 410; ngx.say(cjson.encode({error = "Tickets sold out completely"}))
                else
                    ngx.status = 200; ngx.say(cjson.encode({status = "success", ticket = res, shard = active_shard, ip = msg_or_ip}))
                end
            }
        }
    }
}
