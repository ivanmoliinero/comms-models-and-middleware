worker_processes 1;
events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 ipv6=off;
    
    server {
        listen 80;
        
        location /buy {
            default_type application/json;
            
            content_by_lua_block {
		local cjson = require "cjson"
                local redis = require "resty.redis"
                local red = redis:new()
                
                -- FIX: Connect (1s), Send (1s), Read (2s). Read must be > WAIT timeout.
                red:set_timeouts(1000, 1000, 2000) 
                
                local ok, err = red:connect("redis-master", 6379)
                if not ok then
                    ngx.status = 500
                    ngx.say(cjson.encode({error = "Failed to connect to Redis"}))
                    return
                end
                
                local args = ngx.req.get_uri_args()
                local ticket_id = args.ticket_id
                
                if not ticket_id then
                    ngx.status = 400
                    ngx.say(cjson.encode({error = "Missing ticket_id parameter"}))
                    return
                end
                
                -- STEP 1: EXECUTE
                local res, err = red:fcall("buy_ticket", 2, "purchased_tracking_ids", "tickets-counter", ticket_id)
                
                if not res then
                    ngx.status = 500
                    ngx.say(cjson.encode({error = "Database execution error"}))
                    return
                end
                
                -- STEP 2 & 3: VERIFY AND COMPENSATE
                if tonumber(res) >= 0 then
                    -- Redis will wait up to 1000ms. Socket will stay open for 2000ms.
                    local wait_res, wait_err = red:wait(1, 1000)
                    
                    if not wait_res or tonumber(wait_res) == 0 then
                        -- COMPENSATE
                        local rb_res, rb_err = red:fcall("rollback_ticket", 2, "purchased_tracking_ids", "tickets-counter", ticket_id)
                        
                        if not rb_res then
                            -- If the socket is truly dead, we MUST log this critical failure.
                            ngx.log(ngx.ERR, "CRITICAL: Rollback failed for ID ", ticket_id, " - Error: ", rb_err)
                            ngx.status = 500
                            ngx.say(cjson.encode({error = "FATAL: Replication failed and rollback aborted."}))
                            return
                        end

                        ngx.status = 500
                        ngx.say(cjson.encode({
                            error = "Replication timeout. Purchase rolled back.",
                            debug_wait = tostring(wait_res)
                        }))
                        return
                    end
                    
                    ngx.status = 200 
                    ngx.say(cjson.encode({status = "success", ticket_number = res}))
                elseif tonumber(res) == -1 then
                    ngx.status = 409 
                    ngx.say(cjson.encode({status = "error", message = "Ticket already purchased with this ID"}))
                elseif tonumber(res) == -2 then
                    ngx.status = 410 
                    ngx.say(cjson.encode({status = "error", message = "Tickets sold out completely"}))
                end
                
                red:set_keepalive(10000, 100)
           }
        }
    }
}
