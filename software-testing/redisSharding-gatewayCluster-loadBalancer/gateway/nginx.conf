worker_processes 1;
events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 ipv6=off;
    
    server {
        listen 80;
        
        location /buy {
            default_type application/json;
            
            content_by_lua_block {
                local cjson = require "cjson"
                local redis = require "resty.redis"
                
                local args = ngx.req.get_uri_args()
                local ticket_id = args.ticket_id
                
                if not ticket_id then
                    ngx.status = 400
                    ngx.say(cjson.encode({error = "Missing ticket_id parameter"}))
                    return
                end
                
                -- SHARDING LOGIC: Hash the UUID to determine primary and secondary shards
                local hash = ngx.crc32_short(ticket_id)
                local primary_idx = (hash % 2) + 1  -- Yields 1 or 2
                local secondary_idx = (primary_idx % 2) + 1 -- Yields the opposite
                
                local shards = {
                    {name = "Shard A", host = "redis-shard-a", port = 6379},
                    {name = "Shard B", host = "redis-shard-b", port = 6379}
                }
                
                local function attempt_purchase(shard)
                    local red = redis:new()
                    red:set_timeouts(1000, 1000, 1000)
                    local ok, err = red:connect(shard.host, shard.port)
                    if not ok then
                        ngx.log(ngx.ERR, "Failed to connect to " .. shard.host .. ": ", err)
                        return nil, "Connection failed"
                    end
                    
                    local res, err = red:fcall("buy_ticket", 2, "purchased_tracking_ids", "tickets-counter", ticket_id)
                    red:set_keepalive(10000, 100)
                    return res, err
                end
                
                -- ATTEMPT 1: Primary Shard
                local active_shard = shards[primary_idx]
                local res, err = attempt_purchase(active_shard)
                
                if not res then
                    ngx.status = 500
                    ngx.say(cjson.encode({error = "Database execution error on " .. active_shard.name}))
                    return
                end
                
                -- ATTEMPT 2: Fallback Shard (if Primary is sold out)
                if res == -2 then
                    active_shard = shards[secondary_idx]
                    res, err = attempt_purchase(active_shard)
                    
                    if not res then
                        ngx.status = 500
                        ngx.say(cjson.encode({error = "Database execution error on " .. active_shard.name}))
                        return
                    end
                end
                
                -- RESPONSE TRANSLATION
                if res == -1 then
                    ngx.status = 409 
                    ngx.say(cjson.encode({status = "error", message = "Ticket already purchased with this ID", processed_by = active_shard.name}))
                elseif res == -2 then
                    ngx.status = 410 
                    ngx.say(cjson.encode({status = "error", message = "Tickets sold out completely"}))
                else
                    ngx.status = 200 
                    ngx.say(cjson.encode({status = "success", ticket_number = res, processed_by = active_shard.name}))
                end
            }
        }
    }
}
