worker_processes 1;
events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 ipv6=off;
    
    server {
        listen 80;
        
        location /buy {
            default_type application/json;
            
            content_by_lua_block {
                local cjson = require "cjson"
                local redis = require "resty.redis"
                
                local args = ngx.req.get_uri_args()
                local ticket_id = args.ticket_id
                
                if not ticket_id then
                    ngx.status = 400
                    ngx.say(cjson.encode({error = "Missing ticket_id parameter"}))
                    return
                end
                
                -- SHARDING LOGIC (3 Partitions)
                local hash = ngx.crc32_short(ticket_id)
                local primary_idx = (hash % 3) + 1
                local shard_names = {"shard-a", "shard-b", "shard-c"}
                local target_shard = shard_names[primary_idx]
                
                -- SENTINEL SERVICE DISCOVERY
                local sentinels = {
                    {host = "sentinel-1", port = 26379},
                    {host = "sentinel-2", port = 26379},
                    {host = "sentinel-3", port = 26379}
                }
                
                local function get_master_ip(shard_name)
                    for _, sent in ipairs(sentinels) do
                        local red_sent = redis:new()
                        red_sent:set_timeouts(500, 500, 500) -- Fast fail for dead sentinels
                        local ok, err = red_sent:connect(sent.host, sent.port)
                        
                        if ok then
                            -- Request the master IP
                            local res, err = red_sent:sentinel("get-master-addr-by-name", shard_name)
                            red_sent:set_keepalive(10000, 10)
                            
                            -- res[1] is IP, res[2] is Port
                            if res and type(res) == "table" then
                                return res[1], res[2]
                            end
                        end
                        -- If it failed, the loop simply tries the next sentinel
                    end
                    return nil, "All Sentinels unreachable or master unknown"
                end
                
                -- Discover the current active Master IP
                local master_ip, master_port = get_master_ip(target_shard)
                
                if not master_ip then
                    ngx.status = 503 -- Service Unavailable
                    ngx.say(cjson.encode({error = "Service Discovery Failed. Cluster unreachable."}))
                    return
                end
                
                -- EXECUTE THE TRANSACTION (Saga Pattern with staggered timeouts)
                local red = redis:new()
                red:set_timeouts(1000, 1000, 2000) 
                
                local ok, err = red:connect(master_ip, master_port)
                if not ok then
                    ngx.status = 500
                    ngx.say(cjson.encode({error = "Failed to connect to active master: " .. master_ip}))
                    return
                end
                
                local res, err = red:fcall("buy_ticket", 2, "purchased_tracking_ids", "tickets-counter", ticket_id)
                
                if not res then
                    ngx.status = 500
                    ngx.say(cjson.encode({error = "Database execution error"}))
                    return
                end
                
                if tonumber(res) >= 0 then
                    local wait_res, wait_err = red:wait(1, 1000)
                    
                    if not wait_res or tonumber(wait_res) == 0 then
                        local rb_res, rb_err = red:fcall("rollback_ticket", 2, "purchased_tracking_ids", "tickets-counter", ticket_id)
                        if not rb_res then
                            ngx.log(ngx.ERR, "CRITICAL: Rollback failed for ID ", ticket_id, " - Error: ", rb_err)
                            ngx.status = 500
                            ngx.say(cjson.encode({error = "FATAL: Replication failed and rollback aborted."}))
                            return
                        end
                        ngx.status = 500
                        ngx.say(cjson.encode({error = "Replication timeout. Purchase rolled back."}))
                        return
                    end
                    
                    ngx.status = 200 
                    ngx.say(cjson.encode({status = "success", ticket_number = res, processed_by = target_shard, node_ip = master_ip}))
                elseif tonumber(res) == -1 then
                    ngx.status = 409 
                    ngx.say(cjson.encode({status = "error", message = "Ticket already purchased with this ID", processed_by = target_shard}))
                elseif tonumber(res) == -2 then
                    ngx.status = 410 
                    ngx.say(cjson.encode({status = "error", message = "Tickets sold out in this partition", processed_by = target_shard}))
                end
                
                red:set_keepalive(10000, 100)
            }
        }
    }
}
